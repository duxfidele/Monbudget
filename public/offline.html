<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Hors-Ligne - MonBudget</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E3A5F">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #071324 0%, #0F172A 50%, #1E3A5F 100%);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 0.925rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #1E3A5F;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.875rem 1.25rem;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #254b7a; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #FBBF24;
      background: rgba(245, 158, 11, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-top: 1.25rem;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Vous êtes hors-ligne</h1>
    <p>
      MonBudget continue de fonctionner sans connexion ! Vos modifications sont sauvegardées en local et seront synchronisées automatiquement dès le retour du réseau.
    </p>
    <a href="/dashboard" class="btn">
      Accéder au tableau de bord local
    </a>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span>Synchronisation en attente de réseau</span>
    </div>
  </div>
</body>
</html>
